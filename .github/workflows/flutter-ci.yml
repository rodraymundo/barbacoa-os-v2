# Integracion continua de Barbacoa OS (app movil Flutter, carpeta mobile/).
# Se ejecuta solo en cada push y en cada pull request hacia main.
name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile   # el proyecto Flutter esta en la carpeta mobile
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analisis estatico
        run: flutter analyze --no-fatal-infos

      - name: Pruebas unitarias y de integracion
        run: flutter test --reporter expanded
