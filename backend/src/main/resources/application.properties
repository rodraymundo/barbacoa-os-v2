server.port=${PORT:8080}

# Base de datos de desarrollo (H2 en archivo, no necesitas instalar nada)
spring.datasource.url=jdbc:h2:file:./data/barbacoa;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# JWT: en produccion define la variable de entorno JWT_SECRET (minimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-de-al-menos-32-caracteres-barbacoa}
app.jwt.expiration-minutes=720

# Origenes permitidos para el front web (separados por coma)
app.cors.origins=http://localhost:4200
