name: barbacoa_movil
description: Barbacoa OS Mobile - app del mesero (escaneo de QR de mesas y toma de ordenes).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Cuando tengas el logo: copialo a assets/logo.png y descomenta
  # assets:
  #   - assets/logo.png
